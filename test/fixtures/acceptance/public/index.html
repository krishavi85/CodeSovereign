<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <h1>Task Board</h1>
  <!-- HYGIENE DEFECT: <img> with no alt — auto-repairable (HTML_MISSING_ALT) -->
  <img id="logo" src="logo.svg" width="48" height="48">


  <form id="addForm">
    <input id="title" placeholder="New task" aria-label="New task title">
    <button type="submit" id="addBtn">Add task</button>
  </form>

  <ul id="list"></ul>

  <div class="toolbar">
    <button id="refreshBtn">Refresh</button>

    <!-- MOCK CONTROL: looks interactive, does nothing -->
    <button id="exportBtn" onclick="return false">Export CSV</button>
    <a id="helpLink" href="#">Help</a>

    <!-- INTENTIONALLY BROKEN INTERACTION: calls a function that does not exist -->
    <button id="clearBtn" onclick="clearAllTasks()">Clear all</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
